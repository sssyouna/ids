services:
  # Honeypot
  honeypot:
    build: 
      context: ./http_honeypot
      dockerfile: Dockerfile.honeypot
    container_name: http-honeypot
    ports:
      - "8080:8080"
    restart: unless-stopped
    working_dir: /app
    security_opt:
      - seccomp=./http_honeypot/seccomp_filter.json
    networks:
      - ids-network
    volumes:
      - ./logs:/app  # share logs with host for ELK pickup

  # IDS
  ids:
    build:
      context: ./http_honeypot
      dockerfile: Dockerfile.ids
    container_name: scapy-ids
    working_dir: /app
    command: python sniff.py
    networks:
      - ids-network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./logs:/app/logs  # share logs with host for ELK pickup

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    networks:
      - elk-network
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    container_name: logstash
    ports:
      - "5044:5044"  # Beats input
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
    sysctls:
      - net.core.somaxconn=65535
    networks:
      - elk-network
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logs:/app  # IDS logs mounted
    depends_on:
      - elasticsearch
    privileged: true

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: kibana
    ports:
      - "5601:5601"
    networks:
      - elk-network
    depends_on:
      - elasticsearch

networks:
  ids-network:
    driver: bridge
  elk-network:
    driver: bridge

volumes:
  es_data:
